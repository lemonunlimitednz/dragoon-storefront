<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Dragoon Bikes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-900 flex flex-col min-h-screen">
  <nav class="fixed w-full z-50 bg-white/90 backdrop-blur-md border-b border-gray-100">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <a href="index.html" class="text-2xl font-bold tracking-tighter uppercase">Dragoon</a>
        <div class="flex items-center gap-6 text-sm font-medium text-gray-600">
          <a href="rebranded_fleet.html" class="hover:text-black">Bikes</a>
          <a href="accessories.html" class="hover:text-black">Accessories</a>
          <a href="about.html" class="hover:text-black">About</a>
          <a href="cart.html" class="relative text-sm font-semibold text-black hover:text-blue-600 transition">Cart <span id="cart-count" class="ml-1 inline-flex min-w-[1.25rem] h-5 px-1.5 items-center justify-center rounded-full bg-blue-600 text-white text-[10px] font-bold">0</span></a>
        </div>
      </div>
    </div>
  </nav>

  <main class="pt-24 pb-20 flex-grow max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
    <div class="mb-10 text-center">
      <p class="text-blue-600 font-bold uppercase tracking-widest text-xs mb-2">Get in touch</p>
      <h1 class="text-4xl font-extrabold tracking-tight">Contact Us</h1>
      <p class="text-gray-500 mt-4">Have a question or need support? Send us a message and we'll get back to you shortly.</p>
    </div>

    <div class="bg-white rounded-3xl border border-gray-100 shadow-sm p-8 max-w-xl mx-auto">
      <form id="contact-form" class="space-y-6">
        <div>
          <label for="name" class="block text-sm font-bold text-gray-700 mb-2">Name</label>
          <input type="text" id="name" name="name" required class="w-full bg-gray-50 rounded-xl px-4 py-3 text-sm border border-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-600">
        </div>
        
        <div>
          <label for="email" class="block text-sm font-bold text-gray-700 mb-2">Email Address</label>
          <input type="email" id="email" name="email" required class="w-full bg-gray-50 rounded-xl px-4 py-3 text-sm border border-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-600">
        </div>
        
        <div>
          <label for="message" class="block text-sm font-bold text-gray-700 mb-2">Message</label>
          <textarea id="message" name="message" rows="5" required class="w-full bg-gray-50 rounded-xl px-4 py-3 text-sm border border-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-600"></textarea>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-black text-white py-4 rounded-full font-bold hover:bg-gray-800 transition">Send Message</button>
        
        <div id="status-message" class="hidden text-center text-sm font-bold mt-4"></div>
      </form>
    </div>
  </main>

  <footer class="bg-white border-t border-gray-100 mt-auto">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="flex flex-col md:flex-row justify-between items-center gap-4">
        <p class="text-sm text-gray-500">© 2026 Dragoon Bikes. All rights reserved.</p>
        <div class="flex gap-4 text-sm text-gray-500">
          <a href="#" class="hover:text-black">Privacy Policy</a>
          <a href="#" class="hover:text-black">Terms of Service</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    // Cart logic for the header badge
    function updateCartBadge() {
      try {
        const cart = JSON.parse(localStorage.getItem('dragoon-cart') || '[]');
        const count = cart.reduce((sum, item) => sum + item.quantity, 0);
        const badge = document.getElementById('cart-count');
        if (badge) badge.textContent = count;
      } catch (e) {}
    }
    updateCartBadge();

    // Form submission logic
    document.getElementById('contact-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submit-btn');
      const statusMessage = document.getElementById('status-message');
      
      const formData = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      };

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      submitBtn.classList.add('opacity-70');
      
      try {
        const backendUrl = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:9000/contact' 
            : 'https://dragoon-backend-production.up.railway.app/contact';

        const response = await fetch(backendUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        const result = await response.json();

        if (response.ok) {
          statusMessage.classList.remove('hidden', 'text-red-600');
          statusMessage.classList.add('text-green-600');
          statusMessage.textContent = 'Thank you! Your message has been sent.';
          document.getElementById('contact-form').reset();
        } else {
          throw new Error(result.error || result.details || 'Failed to send message.');
        }
      } catch (error) {
        statusMessage.classList.remove('hidden', 'text-green-600');
        statusMessage.classList.add('text-red-600');
        statusMessage.textContent = 'Oops! Something went wrong. Please try again.';
        console.error('Contact form error:', error);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Message';
        submitBtn.classList.remove('opacity-70');
      }
    });
  </script>
</body>
</html>
